# ── Security Headers ─────────────────────────────────────────────────────────
# No [build] section — Netlify auto-detects Next.js from the root and handles
# the build command and OpenNext adapter injection automatically.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Environment Variables (set in Netlify dashboard) ─────────────────────────
#
# Required:
#   DATABASE_URL               Neon PostgreSQL connection string
#   B2_ACCESS_KEY_ID           Backblaze B2 application key ID
#   B2_SECRET_ACCESS_KEY       Backblaze B2 application key secret
#   B2_ENDPOINT                Backblaze B2 S3 endpoint URL
#   B2_REGION                  Backblaze B2 region
#   B2_BUCKET_NAME             Backblaze B2 bucket name
#   NEXT_PUBLIC_ADMIN_PASSWORD Admin dashboard password
