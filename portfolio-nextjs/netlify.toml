# ── Build Settings ──────────────────────────────────────────────────────────
# These settings live in netlify.toml (not the dashboard) to keep everything
# in one place. Ensure the dashboard has Base/Build/Publish all set to
# "Not set" to avoid conflicts.

[build]
  base = "portfolio-nextjs"
  publish = ".next"
  command = "npm run build"

# ── Next.js Runtime ─────────────────────────────────────────────────────────
# Explicitly enables the OpenNext adapter since auto-detection doesn't scan
# subdirectories. Without this, Netlify treats the project as a generic
# static site and routing breaks.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Security Headers ─────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Environment Variables (set in Netlify dashboard) ─────────────────────────
#
# Required:
#   DATABASE_URL               Neon PostgreSQL connection string
#   B2_ACCESS_KEY_ID           Backblaze B2 application key ID
#   B2_SECRET_ACCESS_KEY       Backblaze B2 application key secret
#   B2_ENDPOINT                Backblaze B2 S3 endpoint URL
#   B2_REGION                  Backblaze B2 region
#   B2_BUCKET_NAME             Backblaze B2 bucket name
#   NEXT_PUBLIC_ADMIN_PASSWORD Admin dashboard password
